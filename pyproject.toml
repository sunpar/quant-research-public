[project]
name = "quant-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "surrealdb==2.0.0",
    "temporalio>=1.34.0",
    "vectorbt==1.2.0",
]

[project.scripts]
quant-research = "quant_research.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research"]

[dependency-groups]
dev = ["pytest>=8.3", "coverage>=7.6", "ruff>=0.11", "hatchling>=1.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["smoke: deterministic local commit checks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["tools", "quant_research"]

[tool.coverage.report]
show_missing = true
